<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Frameless Top Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left"></div>

        <div class="toolbar-actions">
            <!-- Target Language Quick Selector -->
            <div class="lang-selector-container">
                <span class="lang-label">To:</span>
                <select id="target-lang" class="lang-select">
                    <option value="zh" selected>Chinese (中文)</option>
                    <option value="en">English</option>
                    <option value="ja">Japanese (日本語)</option>
                    <option value="ko">Korean (한국어)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="fr">French (Français)</option>
                    <option value="es">Spanish (Español)</option>
                    <option value="ru">Russian (Русский)</option>
                </select>
            </div>
            <!-- Pin Status Toggle -->
            <button id="pin-btn" class="icon-btn active" data-i18n-title="titlePin" title="Toggle Always on Top">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="17" x2="12" y2="22"></line>
                    <path d="M5 17h14v-1.76a2 2 0 0 0-.44-1.24l-2.78-3.5A2 2 0 0 1 15 9.26V5a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.26a2 2 0 0 1-.78 1.56l-2.78 3.5A2 2 0 0 0 5 15.24z"></path>
                </svg>
            </button>
            <!-- Layout Toggle (Horizontal vs Vertical split) -->
            <button id="layout-btn" class="icon-btn" data-i18n-title="titleLayout" title="Toggle Layout Split">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="12" y1="3" x2="12" y2="21" class="layout-h-line"></line>
                    <line x1="3" y1="12" x2="21" y2="12" class="layout-v-line" style="display: none;"></line>
                </svg>
            </button>

            <!-- Consolidated Control Buttons for Transparent Mode (top right) wrapped in a draggable zone -->
            <div id="drag-zone" class="drag-zone" title="Drag to move">
                <div class="drag-zone-buttons">
                    <button id="clear-btn-top" class="action-mini-btn transparent-top-btn" data-i18n-title="titleClear" title="Clear All">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span data-i18n="clearBtnLabel">Clear</span>
                    </button>
                    <button id="paste-translate-btn-top" class="action-mini-btn transparent-top-btn" data-i18n-title="titlePaste" title="Paste clipboard and translate instantly">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                        <span data-i18n="pasteBtnLabel">Paste & Go</span>
                    </button>
                    <button id="copy-btn-top" class="action-mini-btn transparent-top-btn" data-i18n-title="titleCopy" title="Copy Translation">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span data-i18n="copyBtnLabel">Copy</span>
                    </button>

                    <!-- Theme Toggle -->
                    <button id="theme-toggle" class="icon-btn" data-i18n-title="titleTheme" title="Toggle Theme">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                    <!-- Exit Transparent Mode (Return to Main Mode) -->
                    <button id="exit-transparent-btn" class="icon-btn" data-i18n-title="titleExitTransparent" title="Return to Main Mode" style="display: none;">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Settings -->
            <button id="settings-btn" class="icon-btn" data-i18n-title="titleSettings" title="Settings">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
            <!-- Transparent Mode Toggle -->
            <button id="transparent-mode-btn" class="icon-btn" data-i18n-title="titleTransparentMode" title="Enter Transparent Mode">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
            </button>
            <!-- Translate Core Button -->
            <button id="translate-btn" class="translate-btn" data-i18n-title="titleTranslate" data-i18n="translateBtnLabel" title="Translate (Ctrl+Enter)">Translate</button>
        </div>

        <!-- Windows style window controls on the far right (custom monochrome SVG shapes) -->
        <div class="window-controls">
            <button id="win-minimize" class="win-btn minimize" data-i18n-title="titleMinimize" title="Minimize">
                <svg viewBox="0 0 10 1" width="10" height="1" fill="currentColor"><rect width="10" height="1"/></svg>
            </button>
            <button id="win-maximize" class="win-btn maximize" data-i18n-title="titleMaximize" title="Maximize/Restore">
                <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="1.5" width="7" height="7"/></svg>
            </button>
            <button id="win-close" class="win-btn close" data-i18n-title="titleClose" title="Close">
                <svg viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" stroke-width="1.2" fill="none"><path d="M1 1L9 9M9 1L1 9"/></svg>
            </button>
        </div>
    </div>

    <!-- Main Content Containers -->
    <div id="main-container" class="container horizontal-layout">
        <!-- Input Panel -->
        <div class="pane left-pane">
            <textarea id="input-text" data-i18n-placeholder="inputPlaceholder" placeholder="Paste text here to translate... (Ctrl+Enter to translate)"></textarea>
            <!-- Floating Actions inside Textarea Pane -->
            <div class="floating-panel-actions">
                <button id="clear-btn" class="action-mini-btn" data-i18n-title="titleClear" title="Clear All">
                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span data-i18n="clearBtnLabel">Clear</span>
                </button>
                <button id="paste-translate-btn" class="action-mini-btn" data-i18n-title="titlePaste" title="Paste clipboard and translate instantly">
                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    <span data-i18n="pasteBtnLabel">Paste & Go</span>
                </button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Output Panel -->
        <div class="pane right-pane">
            <div class="output-wrapper">
                <div id="output-text" class="output-content"></div>
                <!-- Floating Copy Button in Output -->
                <div class="floating-panel-actions">
                    <button id="clear-btn-right" class="action-mini-btn" data-i18n-title="titleClear" title="Clear All" style="display: none;">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span data-i18n="clearBtnLabel">Clear</span>
                    </button>
                    <button id="paste-translate-btn-right" class="action-mini-btn" data-i18n-title="titlePaste" title="Paste clipboard and translate instantly" style="display: none;">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                        <span data-i18n="pasteBtnLabel">Paste & Go</span>
                    </button>
                    <button id="copy-btn" class="action-mini-btn" data-i18n-title="titleCopy" title="Copy Translation">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span data-i18n="copyBtnLabel">Copy</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Toast notifications container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="settingsTitle">Settings</h2>
                <button id="close-settings" class="icon-btn close-btn" aria-label="Close settings">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="ui-lang" data-i18n="uiLangLabel">UI Language</label>
                    <select id="ui-lang" class="settings-select">
                        <option value="en">English</option>
                        <option value="zh">简体中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                        <option value="ru">Русский</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="api-url" data-i18n="apiUrlLabel">API URL (OpenAI compatible)</label>
                    <input type="text" id="api-url" placeholder="https://api.openai.com/v1/chat/completions">
                </div>
                <div class="form-group">
                    <label for="api-key" data-i18n="apiKeyLabel">API Key</label>
                    <input type="password" id="api-key" placeholder="sk-...">
                </div>
                 <div class="form-group">
                    <label for="model-name" data-i18n="modelLabel">Model</label>
                    <input type="text" id="model-name" placeholder="gpt-3.5-turbo">
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="thinking-type" data-i18n="thinkingLabel">Thinking Mode</label>
                        <select id="thinking-type" class="settings-select">
                            <option value="none" data-i18n="thinkingAuto">None (Auto)</option>
                            <option value="enabled" data-i18n="thinkingEnabled">Enabled</option>
                            <option value="disabled" data-i18n="thinkingDisabled">Disabled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reasoning-effort" data-i18n="reasoningLabel">Reasoning Effort</label>
                        <select id="reasoning-effort" class="settings-select">
                            <option value="none" data-i18n="reasoningAuto">None (Auto)</option>
                            <option value="low" data-i18n="reasoningLow">Low</option>
                            <option value="medium" data-i18n="reasoningMedium">Medium</option>
                            <option value="high" data-i18n="reasoningHigh">High</option>
                            <option value="max" data-i18n="reasoningMax">Max</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="slider-label-row">
                        <label for="opacity-slider" data-i18n="opacityLabel">Window Opacity</label>
                        <span id="opacity-value">100%</span>
                    </div>
                    <input type="range" id="opacity-slider" min="20" max="100" step="5" value="100" class="opacity-slider">
                </div>
                <div class="form-group">
                    <div class="slider-label-row">
                        <label for="trans-opacity-slider" data-i18n="transOpacityLabel">Transparent Mode Opacity</label>
                        <span id="trans-opacity-value">35%</span>
                    </div>
                    <input type="range" id="trans-opacity-slider" min="0" max="80" step="5" value="35" class="opacity-slider">
                </div>
                <div class="form-group">
                    <div class="slider-label-row">
                        <label for="font-size-slider" data-i18n="fontSizeLabel">Text Font Size</label>
                        <span id="font-size-value">14px</span>
                    </div>
                    <input type="range" id="font-size-slider" min="12" max="22" step="1" value="14" class="opacity-slider">
                </div>
                <div class="form-group">
                    <label for="system-prompt" data-i18n="promptLabel">System Prompt Customization</label>
                    <textarea id="system-prompt" rows="3">You are a professional translator. Translate the given text accurately. Maintain tone, format, and markdown structure perfectly.</textarea>
                    <span class="help-text" data-i18n="promptHelp">Note: The system will automatically instruct the model on the target language selected in the toolbar.</span>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings" class="primary-btn" data-i18n="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="node_modules/marked/lib/marked.umd.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
